[project]
name = "typespecs"
version = "12.0.0"
description = "Data specifications via type hints"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pandas>=2",
    "readonlydict>=2",
    "typing-extensions>=4",
]
keywords = [
    "annotation",
    "dataclass",
    "dataframe",
    "namedtuple",
    "python",
    "specification",
    "typeddict",
    "typing",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[[project.authors]]
name = "Akio Taniguchi"
email = "mail@taniguchiak.io"

[project.license]
file = "LICENSE"

[project.urls]
homepage = "https://astropenguin.github.io/typespecs"
repository = "https://github.com/astropenguin/typespecs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26",
    "ipython>=8",
    "myst-parser>=4",
    "pandas-stubs>=2",
    "pydata-sphinx-theme>=0.19",
    "pyright>=1",
    "pytest>=9",
    "sphinx>=8",
]

[tool.pyright]
typeCheckingMode = "strict"
